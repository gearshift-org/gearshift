<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GearShift</title>
    <script type="module">
      // Workaround: @vitejs/plugin-react v5 + Vite 8 (Rolldown) doesn't inject
      // the React Refresh preamble. Safe no-op in production (/@react-refresh
      // only exists in the dev server).
      try {
        const m = await import("/@react-refresh")
        m.default.injectIntoGlobalHook(window)
        window.$RefreshReg$ = () => {}
        window.$RefreshSig$ = () => (type) => type
        window.__vite_plugin_react_preamble_installed__ = true
      } catch {}
    </script>
    <script>
      ;(() => {
        const stored = localStorage.getItem("theme")
        const theme =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : "system"
        const resolved =
          theme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme
        document.documentElement.classList.add(resolved)
        document.documentElement.dataset.theme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
